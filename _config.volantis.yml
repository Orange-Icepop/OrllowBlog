#favicon: favicon.ico

custom_css:
  navbar:
    height: 64px
    width: auto
    effect: [shadow, floatable,blur]
  sidebar:
    effect: [shadow, blur] # set either floatable or blur
  body:
    effect: [ shadow ] # [shadow, floatable, blur]
    highlight:
      language: true # show language of codeblock
      copy_btn: true
    text_align: # left, right, justify, center
      h1: left
      h2: left
      h3: left
      h4: left
      p: justify
  fontfamily:
    codefont:
      fontfamily: 'Maple'
      name: 'Maple'
      url: https://cdn.jsdelivr.net/fontsource/fonts/maple-mono@latest/latin-400-normal.woff2
      weight: normal
      style: normal

navbar:
  visible: auto
  logo: images/wordicon.webp
  menu:
    - name: 博客
      icon: fa-solid fa-rss
      url: /
    - name: 分类
      icon: fa-solid fa-folder-open
      url: categories/
    - name: 标签
      icon: fa-solid fa-tags
      url: tags/
    - name: 归档
      icon: fa-solid fa-archive
      url: archives/
    - name: 友链
      icon: fa-solid fa-link
      url: friends/
    - name: 关于
      icon: fa-solid fa-info-circle
      url: about/
    - name: 夜晚模式
      icon: fas fa-moon
      toggle: darkmode

site_footer:
  layout: [social, license, copyright]
  social:
    - icon: fas fa-envelope
      url: mailto:orangeicepop@orllow.cn
    - icon: fab fa-github
      url: https://github.com/Orange-Icepop
  copyright: '[Copyright © Orange-Icepop](/)'

cover:
  height_scheme: half
  scheme: focus
  display:
    home: true
    archive: true
    others: false # can be written in front-matter 'cover: true'

sidebar:
  position: right # left right
  # 主页、分类、归档等独立页面
  for_page: [blogger, category]
  # layout: docs/post 这类文章页面
  for_post: [toc]
  # 侧边栏组件库
  widget_library:
    blogger:
      class: blogger
      display: [desktop]
      avatar: images/author.webp
      shape: circle
      url: /about/
      title: 橙子冰棒
      subtitle: 普通的中学生，二刺螈，发量充足的程序猿。
      jinrishici: false
      social:
        - icon: fas fa-envelope
          url: mailto:orangeicepop@orllow.cn
        - icon: fab fa-github
          url: https://github.com/Orange-Icepop
    category:
      class: category
      display: [desktop] # [desktop, mobile]
      header:
        icon: fa-solid fa-folder-open
        title: 文章分类
        url: /categories/

comments:
  giscus:
    # 以下配置按照 yml 格式增删填写即可
    repo: Orange-Icepop/BlogDiscussion
    repo-id: R_kgDOQNmj3A
    category: Announcements
    category-id: DIC_kwDOQNmj3M4CxWed
    mapping: "pathname"
    reactions-enabled: "1"
    emit-metadata: "0"
    lang: "zh-CN"
    # 以上配置按照 yml 格式增删填写即可
    theme:
      light: "light" # https://gcore.jsdelivr.net/gh/volantis-x/cdn-volantis@master/css/giscus/light.css
      dark: "dark" # https://gcore.jsdelivr.net/gh/volantis-x/cdn-volantis@master/css/giscus/dark.css

plugins:
  parallax:
    enable: true
    position: fixed
    shuffle: false
    images:
      - images/background.webp
  darkmode:
    enable: true